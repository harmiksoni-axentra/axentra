{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Axentra LLC{% endblock %}</title>
    <meta name="description" content="Axentra LLC is a US-based staffing and consulting company specialized in IT and Non-IT recruitment.">
    <meta property="og:site_name" content="Axentra">
    <meta property="og:title" content="Axentra LLC">
    <meta property="og:url" content="https://axentrallc.com/">
    <meta property="og:type" content="website">
  
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" />
<!--    <link rel="icon" href="{% static 'images/favicon.png' %}" />-->
    <link rel="shortcut icon" href="{% static 'images/favicon.png' %}" />
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}" />
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name":"Axentra",
        "alternateName": "Axentra LLC",
        "url":"https://axentrallc.com"
      }
    </script>
  </head>
  <body>
    {% include "partials/navbar.html" %}
    <main>{% block content %}{% endblock %}</main>
    {% include "partials/footer.html" %}
    <script src="{% static 'js/site.js' %}"></script>
  </body>
</html>
